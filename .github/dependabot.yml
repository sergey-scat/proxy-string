version: 2
updates:
  # Enable regular updates for uv dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly" # Can be changed to "daily" or "monthly"
    
    # Optional: Group updates together so you get 1 PR instead of 20
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Optional: Keep your GitHub Actions workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
