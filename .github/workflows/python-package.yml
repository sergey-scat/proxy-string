# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
    # 1. Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v7

    # 2. Install uv and the specified Python version with caching enabled
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.3
      # uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # 3. Install project dependencies exactly as defined in uv.lock
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    # 4. Lint code with Ruff
    - name: Run Ruff Linter
      run: uv run ruff check .

    # 5. Check code formatting with Ruff
    - name: Run Ruff Formatter
      run: uv run ruff format --check .

    # 6. Run static type checking with ty
    # --output-format github provides inline annotations directly on your PRs
    - name: Run Type Checker (ty)
      run: uv run ty check --output-format github

    # 7. Run the test suite with pytest
    - name: Run Tests (pytest)
      run: uv run pytest
